
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeCanvas — Explore Art History</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="searchbar.css">
</head>

<body>
  <header class="top-box">
    <h1>TimeCanvas</h1>
  </header>

  <div class="map-workspace">
    <section class="timecanvas-search-panel"
      aria-label="Search artworks">

      <h2 class="timecanvas-search-heading">
        Explore Artworks
      </h2>

      <label class="timecanvas-search-label"
        for="timecanvasSearchInput">
        Search by artwork, artist, style, or location
      </label>

      <input
        class="timecanvas-search-input"
        type="search"
        id="timecanvasSearchInput"
        placeholder="Try Picasso, Paris, or Nighthawks"
        autocomplete="off"
      >

      <div class="timecanvas-search-filters">
        <div class="timecanvas-filter-group">
          <label class="timecanvas-search-label"
            for="timecanvasStyleFilter">
            Art Style
          </label>

          <select class="timecanvas-search-filter"
            id="timecanvasStyleFilter">
            <option value="">All styles</option>
          </select>
        </div>

        <div class="timecanvas-filter-group">
          <label class="timecanvas-search-label"
            for="timecanvasPeriodFilter">
            Time Period
          </label>

          <select class="timecanvas-search-filter"
            id="timecanvasPeriodFilter">
            <option value="">All centuries</option>
          </select>
        </div>
      </div>

      <div class="timecanvas-search-footer">
        <span class="timecanvas-search-status"
          id="timecanvasSearchStatus"
          role="status"
          aria-live="polite">
          Loading artworks...
        </span>

        <button class="timecanvas-clear-button"
          id="timecanvasClearSearch"
          type="button">
          Clear filters
        </button>
      </div>

      <div class="timecanvas-search-results"
        id="timecanvasSearchResults"
        aria-label="Artwork search results">
      </div>
    </section>

    <main id="map"
      aria-label="Interactive art history map"></main>
  </div>

  <section id="artwork-detail-panel"
    class="artwork-detail-panel"
    hidden
    aria-label="Artwork information">

    <button id="close-artwork-details"
      class="detail-close-button"
      type="button"
      aria-label="Close artwork details">
      &times;
    </button>

    <div id="artwork-detail-content"></div>
  </section>

  <footer class="timeline-container"
    aria-label="Art history timeline">

    <div class="timeline-heading">
      <h2>Explore Art History</h2>
      <p>
        Select a century, enter one year, or choose a
        custom date range to explore artworks.
      </p>
    </div>

    <div class="timeline-controls-new">

      <div class="timeline-control-field">
        <label for="century-select">
          Jump to a century
        </label>

        <select id="century-select">
          <option value="">All dates / custom range</option>
        </select>
      </div>

      <div class="date-range-controls">

        <div class="timeline-control-field">
          <label for="year-from">
            Year / From year
          </label>

          <input
            type="number"
            id="year-from"
            min="1000"
            max="2026"
            step="1"
            placeholder="e.g. 1889"
          >
        </div>

        <div class="timeline-control-field">
          <label for="year-to">
            To year (optional)
          </label>

          <input
            type="number"
            id="year-to"
            min="1000"
            max="2026"
            step="1"
            placeholder="e.g. 1900"
          >
        </div>
      </div>

      <button id="show-artworks" type="button">
        Show all available artwork
      </button>

      <button id="reset-timeline" type="button">
        Reset timeline
      </button>

      <div class="timeline-range-summary">
        <p id="selected-year" aria-live="polite">
          Selected period: 1000–2026
        </p>

        <p id="timeline-count"
          role="status"
          aria-live="polite">
        </p>
      </div>

    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="internal.js" defer></script>
  <script src="timeline.js" defer></script>
  <script src="searchbar.js" defer></script>
</body>
</html>
